services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
      - --port
      - "5000"
    ports:
      - "127.0.0.1:${SYDNEY_TMD_MLFLOW_PORT:-5000}:5000"
    volumes:
      - ${SYDNEY_TMD_MLFLOW_DIR:-./mlflow-data}:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  study:
    build: .
    depends_on:
      mlflow:
        condition: service_healthy
    entrypoint: ["python", "-m", "sydney_tmd_v2"]
    command: ["all", "--input", "/input", "--config", "/config/experiment.json", "--runs-dir", "/runs", "--logs-dir", "/runs/logs", "--tracking-uri", "http://mlflow:5000"]
    volumes:
      - ${SYDNEY_TMD_INPUT_DIR:?Set SYDNEY_TMD_INPUT_DIR to the downloaded Sydney session directory}:/input:ro
      - ${SYDNEY_TMD_CONFIG_FILE:-./experiment.json}:/config/experiment.json:ro
      - ${SYDNEY_TMD_RUNS_DIR:-./runs}:/runs
